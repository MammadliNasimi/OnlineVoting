# Render Blueprint - https://render.com/docs/blueprint-spec
# Production deployment configuration for OnlineVoting v1

services:
  - type: web
    name: onlinevoting-backend
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Node.js configuration
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3001

      # Blockchain (Sepolia testnet by default)
      - key: BLOCKCHAIN_RPC_URL
        sync: false
      - key: BLOCKCHAIN_NETWORK
        value: Sepolia
      - key: CHAIN_ID
        value: "11155111"

      # Smart contract (SET VIA DASHBOARD AFTER DEPLOYMENT)
      - key: VOTING_CONTRACT_ADDRESS
        sync: false
      - key: ISSUER_PRIVATE_KEY
        sync: false
      - key: RELAYER_PRIVATE_KEY
        sync: false

      # Security
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 24h
      - key: RATE_LIMIT_VOTES
        value: "10"
      - key: RATE_LIMIT_AUTH
        value: "5"

      # Database (SQLite in-container)
      - key: DATABASE_SQLITE
        value: "true"
      - key: SQLITE_PATH
        value: ./votes.db

      # Email (Brevo SMTP by default)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_SECURE
        value: "true"

      # CORS
      - key: CORS_ORIGIN
        sync: false  # Set to your Vercel frontend URL
      - key: FRONTEND_URL
        sync: false

      # Logging
      - key: LOG_LEVEL
        value: info
