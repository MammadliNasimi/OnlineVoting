name: Deploy Contracts to Sepolia

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  deploy-sepolia:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate deploy private key
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          node <<'NODE'
          const key = String(process.env.DEPLOYER_PRIVATE_KEY || '').trim();
          if (!key) {
            console.error('DEPLOYER_PRIVATE_KEY is missing');
            process.exit(1);
          }
          const normalized = key.startsWith('0x') ? key : `0x${key}`;
          if (!/^0x[0-9a-fA-F]{64}$/.test(normalized)) {
            console.error('DEPLOYER_PRIVATE_KEY must be a 32-byte hex private key (64 hex chars, optional 0x prefix).');
            process.exit(1);
          }
          console.log('DEPLOYER_PRIVATE_KEY looks valid.');
          NODE

      - name: Validate Sepolia RPC endpoint
        env:
          BLOCKCHAIN_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
        run: |
          node <<'NODE'
          const rpcUrl = String(process.env.BLOCKCHAIN_RPC_URL || '').trim();
          if (!rpcUrl) {
            console.error('SEPOLIA_RPC_URL is missing');
            process.exit(1);
          }

          async function main() {
            const response = await fetch(rpcUrl, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                jsonrpc: '2.0',
                id: 1,
                method: 'eth_chainId',
                params: []
              })
            });

            if (!response.ok) {
              throw new Error(`RPC request failed with HTTP ${response.status}`);
            }

            const payload = await response.json();
            const chainId = Number(BigInt(payload.result));

            if (chainId !== 11155111) {
              console.error(`SEPOLIA_RPC_URL points to chain id ${chainId}, expected 11155111 (Sepolia).`);
              process.exit(1);
            }

            console.log('SEPOLIA_RPC_URL is connected to Sepolia.');
          }

          main().catch((error) => {
            console.error(error.message || error);
            process.exit(1);
          });
          NODE

      - name: Install blockchain deps
        working-directory: ./blockchain
        run: npm ci

      - name: Deploy contracts (Hardhat)
        working-directory: ./blockchain
        env:
          BLOCKCHAIN_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          ADMIN_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          CI: true
        run: npx hardhat run scripts/deploy-ssi.js --network sepolia

