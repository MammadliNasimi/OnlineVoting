name: Deploy Contracts to Sepolia

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  deploy-sepolia:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install blockchain deps
        working-directory: ./blockchain
        run: npm ci

      - name: Deploy contracts (Hardhat)
        working-directory: ./blockchain
        env:
          BLOCKCHAIN_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          ADMIN_PRIVATE_KEY: ${{ secrets.ADMIN_PRIVATE_KEY || secrets.DEPLOYER_PRIVATE_KEY }}
          CI: true
        run: npx hardhat run scripts/deploy-ssi.js --network sepolia
